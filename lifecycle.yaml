---
version: "2.1.0"

environment:
  defaultServices:
    - name: "tutorial-backend"
    - name: 'tutorial-db'

services:
  - name: tutorial-backend
    defaultUUID: "tutorial-dev-0"
    requires:
      - name: "tutorial-db"
    github:
      repository: "vmelikyan/tutorial-backend"
      branchName: "github-type"
      docker:
        builder:
          engine: 'buildkit'
        defaultTag: "main"
        app:
          dockerfilePath: "Dockerfile.app"
          ports:
            - 8080
          env:
            DATABASE_URL: "{{tutorial-db_internalHostname}}"
            DATABASE_PORT: '5432'
      deployment:
        public: true
        resource:
          cpu:
            request: '10m'
          memory:
            request: '50Mi'
        readiness:
          tcpSocketPort: 8080
        hostnames:
          host: '0env.com'
          defaultInternalHostname: 'tutorial-backend-dev-0'
          defaultPublicUrl: 'tutorial-backend-dev-0.0env.com'

  - name: tutorial-db
    defaultUUID: "tutorial-dev-0"
    github:
      repository: "vmelikyan/tutorial-backend"
      branchName: "main"
      docker:
        builder:
          engine: 'buildkit'
        defaultTag: "main"
        app:
          dockerfilePath: "Dockerfile.db"
          ports:
            - 5432
          env:
            POSTGRES_DB: tasks
            POSTGRES_USER: demouser
            POSTGRES_PASSWORD: willnottell
      deployment:
        public: false
        resource:
          cpu:
            request: '10m'
          memory:
            request: '50Mi'
        readiness:
          tcpSocketPort: 8080
        hostnames:
          host: '0env.com'
          defaultInternalHostname: 'tutorial-db-dev-0'
          defaultPublicUrl: 'tutorial-db-dev-0.0env.com'
